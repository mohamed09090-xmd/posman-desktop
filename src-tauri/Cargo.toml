[package]
name = "posman-desktop"
version = "0.1.0"
description = "POSMAN offline desktop shell"
authors = ["POSMAN"]
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[lib]
name = "posman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
argon2 = { version = "=0.5.3", features = ["std"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tauri = { version = "=2.11.5", features = [] }
time = { version = "=0.3.45", features = ["formatting", "parsing", "macros", "local-offset"] }
uuid = { version = "=1.24.0", features = ["v7"] }
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

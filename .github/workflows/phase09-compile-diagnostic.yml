name: PHASE 09 compile diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/phase09-compile-diagnostic.yml'
      - 'src-tauri/**'

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust 1.85 compile diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - name: Resolve locked graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > cargo-metadata.json
      - name: Capture compiler diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --message-format short 2>&1 | tee phase09-cargo-check.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase09-cargo-check-diagnostic
          path: |
            cargo-metadata.json
            phase09-cargo-check.log
            src-tauri/Cargo.lock
          retention-days: 1
      - name: Preserve compile result
        if: steps.compile.outputs.status != '0'
        run: exit 1

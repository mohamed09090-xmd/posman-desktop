name: PHASE 05 scoped Clippy source fix

on:
  push:
    branches: [phase/05-setup-security-reference-data]
    paths:
      - '.github/workflows/phase05-clippy-fix.yml'

permissions:
  contents: write

concurrency:
  group: phase05-scoped-clippy-fix
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Apply scoped source fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eb98f9347e1111cf625cab3941ba9ebe19dfb178"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): run scoped Clippy source fix"
          python - <<'PY'
          from pathlib import Path

          dto = Path('src-tauri/src/phase05/dto.rs')
          text = dto.read_text(encoding='utf-8')
          blocks = [
          '''#[derive(Clone, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct UpdatePartnerAddressRequest {
              pub id: String,
              pub partner_id: String,
              pub address_kind: String,
              pub label: Option<String>,
              pub address_line_1: String,
              pub address_line_2: Option<String>,
              pub city: Option<String>,
              pub province: Option<String>,
              pub postal_code: Option<String>,
              pub is_default: bool,
              pub row_version: i64,
          }

          ''',
          '''#[derive(Clone, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct UpdatePartnerContactRequest {
              pub id: String,
              pub partner_id: String,
              pub full_name: String,
              pub job_title: Option<String>,
              pub phone: Option<String>,
              pub email: Option<String>,
              pub is_primary: bool,
              pub row_version: i64,
          }

          ''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('expected unused DTO block exactly once')
              text = text.replace(block, '')
          dto.write_text(text, encoding='utf-8')

          products = Path('src-tauri/src/phase05/products.rs')
          text = products.read_text(encoding='utf-8')
          old = '''fn pricing_warning(purchase_price: i64, sale_price: i64) -> Option<&'static str> {
              if sale_price < purchase_price {
                  Some("BELOW_COST")
              } else if sale_price == purchase_price {
                  Some("ZERO_MARGIN")
              } else {
                  None
              }
          }
          '''
          new = '''fn pricing_warning(purchase_price: i64, sale_price: i64) -> Option<&'static str> {
              match sale_price.cmp(&purchase_price) {
                  std::cmp::Ordering::Less => Some("BELOW_COST"),
                  std::cmp::Ordering::Equal => Some("ZERO_MARGIN"),
                  std::cmp::Ordering::Greater => None,
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected pricing comparison exactly once')
          products.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          git diff --check
          test "$(git diff --name-only | sort)" = $'src-tauri/src/phase05/dto.rs\nsrc-tauri/src/phase05/products.rs'
      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/src/phase05/dto.rs src-tauri/src/phase05/products.rs
          git diff --cached --check
          git config user.name 'POSMAN implementation engineer'
          git config user.email '144628717+mohamed09090-xmd@users.noreply.github.com'
          git commit -m 'fix(phase05): resolve backend Clippy blockers'
          git fetch origin phase/05-setup-security-reference-data
          test "$(git rev-parse origin/phase/05-setup-security-reference-data)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:phase/05-setup-security-reference-data

name: Phase 05 CI

on:
  push:
    branches:
      - phase/05-setup-security-reference-data
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase05-ci.yml'
      - 'database/**'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/PHASE-05-REPORT.md'

permissions:
  contents: read

concurrency:
  group: phase-05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Source snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase05-source-${{ github.sha }}
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git/**
            !node_modules/**
            !src-tauri/target/**
            !dist/**

name: PHASE 05 validation

on:
  push:
    branches: [phase/05-setup-security-reference-data]

permissions:
  contents: read

concurrency:
  group: phase05-final-rust-patch
  cancel-in-progress: true

jobs:
  build-verified-rust-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Apply and validate scoped corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "760ce2aa45b6541e4cfe0428135d233f6a260df2"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): run verified Rust patch builder"
          python - <<'PY'
          from pathlib import Path
          import re

          dto = Path('src-tauri/src/phase05/dto.rs')
          text = dto.read_text(encoding='utf-8')
          for name in ('UpdatePartnerAddressRequest', 'UpdatePartnerContactRequest'):
              pattern = rf'\n#\[derive\(Clone, Deserialize\)\]\n#\[serde\(rename_all = "camelCase"\)\]\npub struct {name} \{{.*?\n\}}\n'
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected {name} once')
          dto.write_text(text, encoding='utf-8')

          products = Path('src-tauri/src/phase05/products.rs')
          text = products.read_text(encoding='utf-8')
          old = '''fn pricing_warning(purchase_price: i64, sale_price: i64) -> Option<&'static str> {
    if sale_price < purchase_price {
        Some("BELOW_COST")
    } else if sale_price == purchase_price {
        Some("ZERO_MARGIN")
    } else {
        None
    }
}'''
          new = '''fn pricing_warning(purchase_price: i64, sale_price: i64) -> Option<&'static str> {
    match sale_price.cmp(&purchase_price) {
        std::cmp::Ordering::Less => Some("BELOW_COST"),
        std::cmp::Ordering::Equal => Some("ZERO_MARGIN"),
        std::cmp::Ordering::Greater => None,
    }
}'''
          if text.count(old) != 1:
              raise SystemExit('expected pricing comparison once')
          products.write_text(text.replace(old, new), encoding='utf-8')

          config = Path('src-tauri/src/phase05/config.rs')
          text = config.read_text(encoding='utf-8')
          constant = '''const UPDATE_COMPANY_SETTINGS_SQL: &str = r#"
UPDATE company_settings
SET default_margin_rate_scaled=?1,
    below_cost_policy=?2,
    session_idle_timeout_minutes=?3,
    updated_at=?4,
    updated_by=?5,
    row_version=row_version+1
WHERE company_id=?6
"#;

'''
          marker = 'use super::{\n'
          if text.count(marker) != 1:
              raise SystemExit('expected config marker once')
          text = text.replace(marker, constant + marker, 1)
          old_sql = '''        transaction.execute(
            r#"
            UPDATE company_settings SET default_margin_rate_scaled=?1,
                session_idle_timeout_minutes=?2, updated_at=?3, updated_by=?4,
                row_version=row_version+1 WHERE company_id=?5
            "#,
            params![
                request.default_margin_rate_scaled,
                request.below_cost_policy,
                request.session_idle_timeout_minutes,
                now_iso()?,
                context.user_id,
                context.company_id
            ],
        )?;'''
          new_sql = '''        transaction.execute(
            UPDATE_COMPANY_SETTINGS_SQL,
            params![
                request.default_margin_rate_scaled,
                request.below_cost_policy,
                request.session_idle_timeout_minutes,
                now_iso()?,
                context.user_id,
                context.company_id
            ],
        )?;'''
          if text.count(old_sql) != 1:
              raise SystemExit('expected broken settings SQL once')
          text = text.replace(old_sql, new_sql, 1)
          tail = '''    #[test]
    fn numbering_format_has_year_and_six_digit_default_padding() {
        assert_eq!(sequence_number("FAC", "2026", 1, 6), "FAC-2026-000001");
    }
}'''
          regression = '''    #[test]
    fn numbering_format_has_year_and_six_digit_default_padding() {
        assert_eq!(sequence_number("FAC", "2026", 1, 6), "FAC-2026-000001");
    }

    #[test]
    fn company_settings_update_persists_policy_and_timeout() {
        let connection = rusqlite::Connection::open_in_memory().expect("SQLite");
        connection
            .execute_batch(
                r#"
                CREATE TABLE company_settings (
                    company_id TEXT PRIMARY KEY,
                    default_margin_rate_scaled INTEGER NOT NULL,
                    below_cost_policy TEXT NOT NULL,
                    session_idle_timeout_minutes INTEGER NOT NULL,
                    updated_at TEXT NOT NULL,
                    updated_by TEXT NOT NULL,
                    row_version INTEGER NOT NULL
                );
                INSERT INTO company_settings VALUES ('c',100000,'WARNING_ONLY',15,'old','u',1);
                "#,
            )
            .expect("fixture");
        connection
            .execute(
                UPDATE_COMPANY_SETTINGS_SQL,
                rusqlite::params![250000_i64, "ADMIN_OVERRIDE", 45_i64, "new", "u2", "c"],
            )
            .expect("update");
        let actual: (i64, String, i64, i64) = connection
            .query_row(
                "SELECT default_margin_rate_scaled,below_cost_policy,session_idle_timeout_minutes,row_version FROM company_settings WHERE company_id='c'",
                [],
                |row| Ok((row.get(0)?, row.get(1)?, row.get(2)?, row.get(3)?)),
            )
            .expect("result");
        assert_eq!(actual, (250000, "ADMIN_OVERRIDE".to_owned(), 45, 2));
    }
}'''
          if text.count(tail) != 1:
              raise SystemExit('expected config test tail once')
          config.write_text(text.replace(tail, regression, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked -- --nocapture
          git diff --check
          test "$(git diff --name-only | sort)" = $'src-tauri/src/phase05/config.rs\nsrc-tauri/src/phase05/dto.rs\nsrc-tauri/src/phase05/products.rs'
      - name: Package verified source
        run: |
          mkdir -p "${RUNNER_TEMP}/phase05-rust-patch/src-tauri/src/phase05"
          cp src-tauri/src/phase05/{config,dto,products}.rs "${RUNNER_TEMP}/phase05-rust-patch/src-tauri/src/phase05/"
          (cd "${RUNNER_TEMP}/phase05-rust-patch" && sha256sum src-tauri/src/phase05/*.rs > SHA256SUMS)
      - name: Upload verified source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-05-final-rust-patch
          path: ${{ runner.temp }}/phase05-rust-patch
          if-no-files-found: error
          retention-days: 30

name: Patch 01A commit log

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'phase/01-data-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Publish Patch 01A commit log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '<!-- patch-01a-exact-commit-log -->'
            echo '## Exact Patch 01A commit log'
            echo
            git log --reverse --format='- `%H` — %s' 4cd601546acada4931abead90c586fe483be29c4..HEAD
          } > /tmp/patch01a-log.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/patch01a-log.md

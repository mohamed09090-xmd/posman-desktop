name: PHASE 07 source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact repository tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base origin/main HEAD)" = "036ac89c07ddee1e26402c1c523529adbba48860"
          tar --exclude=.git --exclude=node_modules --exclude=target -czf "$RUNNER_TEMP/phase07-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/phase07-source.tar.gz" > "$RUNNER_TEMP/phase07-source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: phase-07-source-snapshot
          path: |
            ${{ runner.temp }}/phase07-source.tar.gz
            ${{ runner.temp }}/phase07-source.sha256
          if-no-files-found: error
          retention-days: 1

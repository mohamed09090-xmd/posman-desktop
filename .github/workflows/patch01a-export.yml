name: Patch 01A source export

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'phase/01-data-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          tar --exclude=.git -czf /tmp/posman-phase01-source.tar.gz .
          sha256sum /tmp/posman-phase01-source.tar.gz > /tmp/posman-phase01-source.sha256
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: patch01a-source
          path: |
            /tmp/posman-phase01-source.tar.gz
            /tmp/posman-phase01-source.sha256
          if-no-files-found: error
          retention-days: 1

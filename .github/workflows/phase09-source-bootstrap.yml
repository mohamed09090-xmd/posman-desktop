name: PHASE 09 temporary source bootstrap

on:
  push:
    branches:
      - phase/09-documents-reports-audit-backup
    paths:
      - '.github/workflows/phase09-source-bootstrap.yml'
      - 'src-tauri/Cargo.toml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/phase09-source-bootstrap.yml'
      - 'src-tauri/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase09-source-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-lock:
    name: Generate verified Cargo lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact PHASE 09 head
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://x-access-token:${GH_READ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Generate and verify pinned lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path source/src-tauri/Cargo.toml
          cargo metadata --manifest-path source/src-tauri/Cargo.toml --locked --no-deps > cargo-metadata.json
          sha256sum source/src-tauri/Cargo.lock | tee cargo-lock.sha256
          printf '%s\n' "$SOURCE_SHA" > cargo-lock.commit
      - name: Upload verified Cargo lock
        uses: actions/upload-artifact@v4
        with:
          name: phase09-cargo-lock-${{ github.run_id }}
          path: |
            source/src-tauri/Cargo.lock
            cargo-lock.sha256
            cargo-lock.commit
            cargo-metadata.json
          if-no-files-found: error
          retention-days: 1

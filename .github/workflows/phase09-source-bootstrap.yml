name: PHASE 09 temporary recovery bootstrap

on:
  pull_request:
    branches:
      - main
    types: [edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase09-recovery-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-checkpoint:
    name: Apply preserved PHASE 09 checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_WRITE_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "${HEAD_BRANCH}" --single-branch \
            "https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git config user.name "POSMAN Phase 09 Recovery"
          git config user.email "144628717+mohamed09090-xmd@users.noreply.github.com"
      - name: Apply one preserved checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd source
          mapfile -t parts < <(find .phase09-bootstrap -maxdepth 1 -type f -name '*.b64.part-*' 2>/dev/null | sort)
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "No checkpoint parts present; nothing to apply."
            exit 0
          fi
          work="$(mktemp -d)"
          cat "${parts[@]}" | base64 --decode > "$work/checkpoint.tar.gz"
          tar --extract --gzip --file "$work/checkpoint.tar.gz" --directory "$work" --no-same-owner
          test -d "$work/files"
          test -f "$work/manifest/message.txt"
          message="$(cat "$work/manifest/message.txt")"
          test -n "$message"
          cp -a "$work/files/." .
          if [[ -s "$work/manifest/delete.txt" ]]; then
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              [[ "$path" != /* && "$path" != *'..'* ]] || { echo "Unsafe delete path: $path" >&2; exit 1; }
              rm -rf -- "$path"
            done < "$work/manifest/delete.txt"
          fi
          rm -rf .phase09-bootstrap
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Checkpoint produced no repository changes."
            exit 0
          fi
          git commit -m "$message"
          git push origin "HEAD:${HEAD_BRANCH}"

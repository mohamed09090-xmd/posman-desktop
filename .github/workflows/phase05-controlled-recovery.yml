name: PHASE 05 controlled historical recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase05-controlled-recovery.yml'

permissions:
  contents: write

concurrency:
  group: phase05-controlled-historical-recovery
  cancel-in-progress: false

jobs:
  recover-source:
    if: github.event.pull_request.head.ref == 'phase/05-setup-security-reference-data'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PHASE 05 branch
        uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0

      - name: Verify exclusive recovery coordinate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "phase/05-setup-security-reference-data"
          test "$(git rev-parse HEAD^)" = "cd7f2f8072b091eb7749747a6d1d24b0fcf3f45f"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): retry controlled historical recovery"
          test "$(git rev-parse origin/main)" = "77d297f08ec3c46920dd1b94710995834854dd9a"

      - name: Cherry-pick the authorized historical range in order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'POSMAN implementation engineer'
          git config user.email '144628717+mohamed09090-xmd@users.noreply.github.com'
          git cherry-pick \
            028b4bc4d439a63e889a28eeebc8559494a10180 \
            c9a36d46ff747a0400fc4635e52af5f302d07c3d \
            8d5974cd97df464f9210df0606cedce93c8fb533 \
            7423ae48dcbd40201623981668b4d84198402d41 \
            a71a85d9c2a36b367ad37e9e6f2916e2eed002d3 \
            595cb0e5218a083b81b199059d35236ea6444ccc \
            cf65daa5971ee40b92b42aae7d434788a7cf2e0c \
            71f4c25aecb97dbcdc30ac547b2b68fc26319dcb \
            a29397e9cb8dabaee3920d0de016c2c783d4c963 \
            030805a02845cc1bca46449dd5a0dedfc08d2fe3 \
            4b78830be0af8e6603442ada7f26dcf271ea993c \
            33bf92db3c88e7b69c0774ed0b45e59924f892d7 \
            84de16e531ab531a6372135cce74c0e63473787c \
            f27d094178fe8be5024d828f461d6f0ab04a8c0d

      - name: Verify recovered source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src-tauri/src/phase05 -type f | wc -l)" -eq 14
          test "$(git diff --name-only add62a6acb104ac5bc928faa746b61b0646fe920..HEAD -- src-tauri/src/phase05 | wc -l)" -eq 14
          test -z "$(git diff --name-only add62a6acb104ac5bc928faa746b61b0646fe920..HEAD -- . ':(exclude)src-tauri/src/phase05/**' ':(exclude).github/workflows/phase05-controlled-recovery.yml')"
          git diff --check add62a6acb104ac5bc928faa746b61b0646fe920..HEAD

      - name: Remove recovery workflow and push recovered commits
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase05-controlled-recovery.yml
          git commit -m 'chore(phase05): remove controlled source recovery workflow'
          git push origin HEAD:phase/05-setup-security-reference-data

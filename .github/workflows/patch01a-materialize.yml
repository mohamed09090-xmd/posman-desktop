name: Patch 01A materialization

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'phase/01-data-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct verified patch bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patch01a/bundle.b64 > /tmp/patch01a-patches.tar.gz
          echo "8f3dbc8d9050bc8cfe7e1e9a47c7b49dc5dad22ba2c6b1567dbbea108f567a1c  /tmp/patch01a-patches.tar.gz" | sha256sum --check
          mkdir -p /tmp/patch01a
          tar -xzf /tmp/patch01a-patches.tar.gz -C /tmp/patch01a

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "POSMAN Implementation Agent"
          git config user.email "implementation@posman.local"

      - name: Commit SQLite integrity hardening
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/patch01a-code.patch
          git apply /tmp/patch01a-code.patch
          python scripts/verify_schema.py
          git add database/migrations database/schema.sql database/tests/invariants.sql scripts/verify_schema.py
          git commit -m "fix(db): harden phase 01 SQLite integrity"

      - name: Commit review documentation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/patch01a-docs.patch
          git apply /tmp/patch01a-docs.patch
          rm -rf .patch01a
          git add README.md docs .patch01a
          git commit -m "docs: record phase 01 integrity review patch"

      - name: Final validation and push
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_schema.py
          git diff --check
          test -z "$(git status --short)"
          git log -2 --format='%H %s'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

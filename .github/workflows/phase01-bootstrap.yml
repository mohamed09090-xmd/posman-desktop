name: Phase 01 repository bootstrap
# Transport-only workflow; it deletes itself after materialization.

on:
  push:
    branches:
      - phase/01-data-foundation
    paths:
      - .phase01-bootstrap/**
      - .github/workflows/phase01-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .phase01-bootstrap/chunk* | base64 --decode > /tmp/phase01.tar.gz
          echo "23eaa95e4aeface113cc18194347216ae4fd0451b49c89cb505082050a99af21  /tmp/phase01.tar.gz" | sha256sum --check
          mkdir -p /tmp/phase01
          tar -xzf /tmp/phase01.tar.gz -C /tmp/phase01

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "POSMAN Implementation Agent"
          git config user.email "implementation@posman.local"

      - name: Commit specification and architecture documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cp -a /tmp/phase01/docs/spec docs/
          cp -a /tmp/phase01/docs/architecture docs/
          git add docs/spec docs/architecture
          git commit -m "docs: add POSMAN blueprint and data architecture"

      - name: Commit ordered SQLite data foundation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database
          cp -a /tmp/phase01/database/migrations database/
          cp -a /tmp/phase01/database/seed database/
          cp /tmp/phase01/database/schema.sql database/schema.sql
          git add database/migrations database/seed database/schema.sql
          git commit -m "feat(db): add ordered SQLite schema migrations"

      - name: Commit schema verification and CI
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/phase01/database/tests database/
          cp -a /tmp/phase01/scripts .
          rm -rf scripts/__pycache__
          cp /tmp/phase01/.github/pull_request_template.md .github/pull_request_template.md
          cp /tmp/phase01/.github/workflows/schema-ci.yml .github/workflows/schema-ci.yml
          rm -rf .phase01-bootstrap .github/workflows/phase01-bootstrap.yml
          python scripts/verify_schema.py
          git diff --check
          git add -A
          git commit -m "test(db): add schema and invariant verification"
          test -z "$(git status --short)"
          git push origin HEAD:phase/01-data-foundation

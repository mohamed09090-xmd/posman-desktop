name: PHASE 05 scoped formatting fix

on:
  push:
    branches: [phase/05-setup-security-reference-data]
    paths:
      - '.github/workflows/phase05-format-fix.yml'

permissions:
  contents: write

concurrency:
  group: phase05-scoped-format-fix
  cancel-in-progress: false

jobs:
  format-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt
      - name: Apply verified contrast and rustfmt fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "76e9b6b02dc1d6a1b7be41369cb209bda66fc046"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): run scoped source formatting fix"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/phase05/phase05.css')
          text = path.read_text(encoding='utf-8')
          old = '.p5-table th { background: #e7e3d7; font-size: .78rem; color: var(--p5-muted); }'
          new = '.p5-table th { background: #e7e3d7; font-size: .78rem; color: #56605c; }'
          if text.count(old) != 1:
              raise SystemExit('expected table-header contrast rule exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          python - <<'PY'
          def channel(value):
              value /= 255
              return value / 12.92 if value <= 0.04045 else ((value + 0.055) / 1.055) ** 2.4
          def luminance(value):
              value=value.lstrip('#')
              r,g,b=(channel(int(value[i:i+2],16)) for i in (0,2,4))
              return .2126*r+.7152*g+.0722*b
          fg,bg=luminance('#56605c'),luminance('#e7e3d7')
          ratio=(max(fg,bg)+.05)/(min(fg,bg)+.05)
          print(f'contrast ratio: {ratio:.4f}:1')
          if ratio < 4.5: raise SystemExit('contrast remains below WCAG AA')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(src/features/phase05/phase05\.css|src-tauri/.*\.rs)$'; then
            echo 'unexpected changed path' >&2
            exit 1
          fi
      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add src/features/phase05/phase05.css src-tauri
          git diff --cached --check
          git config user.name 'POSMAN implementation engineer'
          git config user.email '144628717+mohamed09090-xmd@users.noreply.github.com'
          git commit -m 'fix(phase05): restore accessible contrast and Rust formatting'
          git fetch origin phase/05-setup-security-reference-data
          test "$(git rev-parse origin/phase/05-setup-security-reference-data)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:phase/05-setup-security-reference-data

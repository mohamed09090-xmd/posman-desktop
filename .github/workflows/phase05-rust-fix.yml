name: PHASE 05 scoped Rust regression fix

on:
  push:
    branches: [phase/05-setup-security-reference-data]
    paths:
      - '.github/workflows/phase05-rust-fix.yml'

permissions:
  contents: write

concurrency:
  group: phase05-scoped-rust-regression-fix
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Apply scoped source fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eb98f9347e1111cf625cab3941ba9ebe19dfb178"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): run scoped Rust regression fix"
          python - <<'PY'
          from pathlib import Path
          import re

          dto = Path('src-tauri/src/phase05/dto.rs')
          text = dto.read_text(encoding='utf-8')
          patterns = [
              r'\n#\[derive\(Clone, Deserialize\)\]\n#\[serde\(rename_all = "camelCase"\)\]\npub struct UpdatePartnerAddressRequest \{.*?\n\}\n',
              r'\n#\[derive\(Clone, Deserialize\)\]\n#\[serde\(rename_all = "camelCase"\)\]\npub struct UpdatePartnerContactRequest \{.*?\n\}\n',
          ]
          for pattern in patterns:
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected exactly one unused DTO block: {pattern}')
          dto.write_text(text, encoding='utf-8')

          products = Path('src-tauri/src/phase05/products.rs')
          text = products.read_text(encoding='utf-8')
          old = '''fn pricing_warning(purchase_price: i64, sale_price: i64) -> Option<&'static str> {
    if sale_price < purchase_price {
        Some("BELOW_COST")
    } else if sale_price == purchase_price {
        Some("ZERO_MARGIN")
    } else {
        None
    }
}'''
          new = '''fn pricing_warning(purchase_price: i64, sale_price: i64) -> Option<&'static str> {
    match sale_price.cmp(&purchase_price) {
        std::cmp::Ordering::Less => Some("BELOW_COST"),
        std::cmp::Ordering::Equal => Some("ZERO_MARGIN"),
        std::cmp::Ordering::Greater => None,
    }
}'''
          if text.count(old) != 1:
              raise SystemExit('expected pricing_warning comparison chain exactly once')
          products.write_text(text.replace(old, new), encoding='utf-8')

          config = Path('src-tauri/src/phase05/config.rs')
          text = config.read_text(encoding='utf-8')
          marker = 'use super::{\n'
          constant = '''const UPDATE_COMPANY_SETTINGS_SQL: &str = r#"
UPDATE company_settings
SET default_margin_rate_scaled=?1,
    below_cost_policy=?2,
    session_idle_timeout_minutes=?3,
    updated_at=?4,
    updated_by=?5,
    row_version=row_version+1
WHERE company_id=?6
"#;

'''
          if constant not in text:
              if text.count(marker) != 1:
                  raise SystemExit('expected config import marker exactly once')
              text = text.replace(marker, constant + marker, 1)
          old_sql = '''        transaction.execute(
            r#"
            UPDATE company_settings SET default_margin_rate_scaled=?1,
                session_idle_timeout_minutes=?2, updated_at=?3, updated_by=?4,
                row_version=row_version+1 WHERE company_id=?5
            "#,
            params![request.default_margin_rate_scaled, request.below_cost_policy,
                request.session_idle_timeout_minutes, now_iso()?, context.user_id, context.company_id],
        )?;'''
          new_sql = '''        transaction.execute(
            UPDATE_COMPANY_SETTINGS_SQL,
            params![
                request.default_margin_rate_scaled,
                request.below_cost_policy,
                request.session_idle_timeout_minutes,
                now_iso()?,
                context.user_id,
                context.company_id
            ],
        )?;'''
          if text.count(old_sql) != 1:
              raise SystemExit('expected broken company_settings update exactly once')
          text = text.replace(old_sql, new_sql, 1)
          old_test = '''    #[test]
    fn numbering_format_has_year_and_six_digit_default_padding() {
        assert_eq!(sequence_number("FAC", "2026", 1, 6), "FAC-2026-000001");
    }
}'''
          new_test = '''    #[test]
    fn numbering_format_has_year_and_six_digit_default_padding() {
        assert_eq!(sequence_number("FAC", "2026", 1, 6), "FAC-2026-000001");
    }

    #[test]
    fn company_settings_update_persists_margin_policy_timeout_and_version() {
        let connection = rusqlite::Connection::open_in_memory().expect("in-memory SQLite");
        connection
            .execute_batch(
                r#"
                CREATE TABLE company_settings (
                    company_id TEXT PRIMARY KEY,
                    default_margin_rate_scaled INTEGER NOT NULL,
                    below_cost_policy TEXT NOT NULL,
                    session_idle_timeout_minutes INTEGER NOT NULL,
                    updated_at TEXT NOT NULL,
                    updated_by TEXT NOT NULL,
                    row_version INTEGER NOT NULL
                );
                INSERT INTO company_settings VALUES (
                    'company-1', 100000, 'WARN', 15,
                    '2026-01-01T00:00:00Z', 'user-1', 1
                );
                "#,
            )
            .expect("settings fixture");

        let changed = connection
            .execute(
                UPDATE_COMPANY_SETTINGS_SQL,
                rusqlite::params![
                    250000_i64,
                    "ADMIN_OVERRIDE",
                    45_i64,
                    "2026-08-02T12:00:00Z",
                    "user-2",
                    "company-1"
                ],
            )
            .expect("settings update");
        assert_eq!(changed, 1);

        let actual = connection
            .query_row(
                "SELECT default_margin_rate_scaled, below_cost_policy, session_idle_timeout_minutes, updated_at, updated_by, row_version FROM company_settings WHERE company_id='company-1'",
                [],
                |row| {
                    Ok((
                        row.get::<_, i64>(0)?,
                        row.get::<_, String>(1)?,
                        row.get::<_, i64>(2)?,
                        row.get::<_, String>(3)?,
                        row.get::<_, String>(4)?,
                        row.get::<_, i64>(5)?,
                    ))
                },
            )
            .expect("updated settings");

        assert_eq!(
            actual,
            (
                250000,
                "ADMIN_OVERRIDE".to_owned(),
                45,
                "2026-08-02T12:00:00Z".to_owned(),
                "user-2".to_owned(),
                2,
            )
        );
    }
}'''
          if text.count(old_test) != 1:
              raise SystemExit('expected config test module tail exactly once')
          config.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^src-tauri/src/phase05/(config|dto|products)\.rs$'; then
            echo 'unexpected changed path' >&2
            exit 1
          fi
      - name: Validate Rust 1.85 regression fix
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked -- --nocapture
      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/src/phase05/config.rs src-tauri/src/phase05/dto.rs src-tauri/src/phase05/products.rs
          git diff --cached --check
          git config user.name 'POSMAN implementation engineer'
          git config user.email '144628717+mohamed09090-xmd@users.noreply.github.com'
          git commit -m 'fix(phase05): persist pricing policy and satisfy Rust gates'
          git fetch origin phase/05-setup-security-reference-data
          test "$(git rev-parse origin/phase/05-setup-security-reference-data)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:phase/05-setup-security-reference-data

name: PHASE 09 temporary lock bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/phase09-lock-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase09-lock-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Generate pinned Cargo lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact branch head
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://x-access-token:${GH_READ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path source/src-tauri/Cargo.toml
          cargo metadata --manifest-path source/src-tauri/Cargo.toml --locked --no-deps > cargo-metadata.json
          sha256sum source/src-tauri/Cargo.lock | tee cargo-lock.sha256
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase09-cargo-lock-secondary-${{ github.run_id }}
          path: |
            source/src-tauri/Cargo.lock
            cargo-lock.sha256
            cargo-metadata.json
          if-no-files-found: error
          retention-days: 1

name: PHASE 05 source snapshot

on:
  push:
    branches:
      - phase/05-setup-security-reference-data
    paths:
      - '.github/workflows/phase05-source-snapshot.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase05-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'phase/05-setup-security-reference-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase05-source-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1

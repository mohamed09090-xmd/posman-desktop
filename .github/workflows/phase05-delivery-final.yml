name: PHASE 05 repository snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase05-delivery-final.yml'

permissions:
  contents: read

concurrency:
  group: phase05-repository-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0
      - name: Verify coordinate and package repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "aea2ef960ad1bd7d8315f04b2ff5af2002829df9"
          test "$(git rev-parse origin/main)" = "77d297f08ec3c46920dd1b94710995834854dd9a"
          tar --exclude=.git --exclude=node_modules --exclude=target -czf "${RUNNER_TEMP}/phase05-repository.tar.gz" .
          sha256sum "${RUNNER_TEMP}/phase05-repository.tar.gz" > "${RUNNER_TEMP}/phase05-repository.sha256"
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase-05-repository-snapshot
          path: |
            ${{ runner.temp }}/phase05-repository.tar.gz
            ${{ runner.temp }}/phase05-repository.sha256
          if-no-files-found: error
          retention-days: 30

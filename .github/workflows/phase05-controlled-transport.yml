name: PHASE 05 controlled transport

on:
  pull_request:
    branches:
      - main
    paths:
      - '.phase05-transport/**'
      - '.github/workflows/phase05-controlled-transport.yml'

permissions:
  contents: write

concurrency:
  group: phase05-controlled-transport
  cancel-in-progress: false

jobs:
  apply-05b1:
    if: github.event.pull_request.head.ref == 'phase/05-setup-security-reference-data'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0

      - name: Verify authorized parent and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "phase/05-setup-security-reference-data"
          test "$(git rev-parse HEAD^)" = "b68982c70a7b04ea306df46acbf792b29a0776a7"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): retry 05B-1 controlled transport"
          printf '%s  %s\n' \
            '8b4be8d49021908e4dc7c499751f96ff6c997b1e3c200c0c9ba788c79a696182' '.phase05-transport/05b1.payload.part.00' \
            'b644a860fb8d8ce633e2a30fd51efb6317c40401cfd8fa86532ba6f93def5dcf' '.phase05-transport/05b1.payload.part.01' \
            '938277b6e348ea0adbe132f4566fe0cdf8576abd7fcb056d45d7cee6d4f86882' '.phase05-transport/05b1.payload.part.02' \
            | sha256sum --check --strict
          cat .phase05-transport/05b1.payload.part.* | base64 --decode > /tmp/phase05-05b1.tar.gz
          printf '%s  %s\n' \
            'cb764c46b5d5926b0a259faca70e2d5b97de7f82e5b6c82ada220f1ed024ff46' '/tmp/phase05-05b1.tar.gz' \
            | sha256sum --check --strict

      - name: Apply reconciled database and verifier files
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip --file /tmp/phase05-05b1.tar.gz --directory .
          python scripts/verify_schema.py --write-schema
          python scripts/verify_schema.py
          python -m py_compile scripts/verify_schema.py tests/e2e/run_ui_gallery.py

      - name: Commit logical 05B-1 change and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git add \
            database/migrations/0005_setup_security_reference_data.sql \
            database/schema.sql \
            database/tests/invariants.sql \
            scripts/verify_schema.py \
            src-tauri/src/infrastructure/database/migrations.rs \
            src-tauri/src/infrastructure/database/mod.rs \
            src-tauri/src/infrastructure/database/tests.rs \
            src-tauri/src/lib.rs \
            tests/e2e/run_ui_gallery.py \
            tests/integration/runtime-status.test.ts
          git rm -r .phase05-transport .github/workflows/phase05-controlled-transport.yml
          git diff --cached --check
          git config user.name 'POSMAN implementation engineer'
          git config user.email '144628717+mohamed09090-xmd@users.noreply.github.com'
          git commit -m 'fix(db): restore accepted verifier and reconcile migration 0005'
          git push origin HEAD:phase/05-setup-security-reference-data

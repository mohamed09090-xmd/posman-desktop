name: Frontend Runtime Integration

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/integration-ci.yml"
      - ".github/workflows/ui-ci.yml"
      - ".github/workflows/runtime-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "src/platform/tauri/**"
      - "src/features/runtime/**"
      - "src/app/AppRoot.tsx"
      - "src/components/layout.tsx"
      - "src/i18n/dictionaries.ts"
      - "src-tauri/src/lib.rs"
      - "tests/integration/**"
      - "tests/ui/i18n-fixtures.test.ts"
      - "tests/e2e/run_ui_gallery.py"
      - "docs/architecture/frontend-runtime-integration.md"
      - "docs/PHASE-04-REPORT.md"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/integration-ci.yml"
      - ".github/workflows/ui-ci.yml"
      - ".github/workflows/runtime-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "src/platform/tauri/**"
      - "src/features/runtime/**"
      - "src/app/AppRoot.tsx"
      - "src/components/layout.tsx"
      - "src/i18n/dictionaries.ts"
      - "src-tauri/src/lib.rs"
      - "tests/integration/**"
      - "tests/ui/i18n-fixtures.test.ts"
      - "tests/e2e/run_ui_gallery.py"
      - "docs/architecture/frontend-runtime-integration.md"
      - "docs/PHASE-04-REPORT.md"

concurrency:
  group: frontend-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-integration:
    name: Frontend ↔ local runtime gate (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: f4cda85b24f9d69ebb0442c02f8a037da8ba9baf
    steps:
      - name: Check out Pull Request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create evidence directory and record metadata
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/phase-04-integration-evidence"
          ui_artifact_dir="${RUNNER_TEMP}/posman-ui-artifacts"
          echo "EVIDENCE_DIR=${evidence_dir}" >> "$GITHUB_ENV"
          echo "UI_ARTIFACT_DIR=${ui_artifact_dir}" >> "$GITHUB_ENV"
          mkdir -p "$evidence_dir"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=$(git rev-parse HEAD)"
            echo "baseline=${BASELINE_SHA}"
            echo "ref=${GITHUB_REF}"
          } | tee "$evidence_dir/metadata.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install official Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Verify accepted SQLite foundation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_schema.py 2>&1 | tee "$EVIDENCE_DIR/schema-verification.log"

      - name: Enforce Phase 04 ownership from accepted baseline
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{os.environ['BASELINE_SHA']}...HEAD"],
              text=True,
          ).splitlines()
          exact = {
              "package.json", "package-lock.json", "src/app/AppRoot.tsx",
              "src/components/layout.tsx", "src/i18n/dictionaries.ts",
              "src-tauri/src/lib.rs", "tests/ui/i18n-fixtures.test.ts",
              "tests/e2e/run_ui_gallery.py", ".github/workflows/integration-ci.yml",
              ".github/workflows/ui-ci.yml", ".github/workflows/runtime-ci.yml",
              "docs/architecture/frontend-runtime-integration.md",
              "docs/PHASE-04-REPORT.md",
          }
          prefixes = ("src/platform/tauri/", "src/features/runtime/", "tests/integration/")
          unexpected = [p for p in changed if p not in exact and not p.startswith(prefixes)]
          Path(os.environ["EVIDENCE_DIR"], "ownership-diff.txt").write_text(
              "\n".join(changed) + "\n", encoding="utf-8"
          )
          print("\n".join(changed))
          if unexpected:
              print("Unexpected Phase 04 paths:\n" + "\n".join(unexpected), file=sys.stderr)
              raise SystemExit(1)

      - name: Confirm no write-capable workflow remains
        shell: python
        run: |
          from pathlib import Path
          failures = [
              str(path) for path in Path(".github/workflows").glob("*.yml")
              if "contents: write" in path.read_text(encoding="utf-8")
          ]
          print("\n".join(failures))
          raise SystemExit(1 if failures else 0)

      - name: Install locked frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"

      - name: Install browser-test tooling outside the product manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.57.0 2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"
          python -m playwright install --with-deps chromium 2>&1 | tee -a "$EVIDENCE_DIR/playwright-install.log"
          npm install --no-save --package-lock=false axe-core@4.10.3 2>&1 | tee "$EVIDENCE_DIR/axe-install.log"

      - name: Reject runtime network clients and external assets
        shell: python
        run: |
          from pathlib import Path
          roots = [
              Path("src/app"), Path("src/components"), Path("src/i18n"),
              Path("src/styles"), Path("src/features/runtime"), Path("src/platform/tauri"),
          ]
          needles = ("fetch(", "XMLHttpRequest", "WebSocket(", "http://", "https://")
          failures = []
          for root in roots:
              for path in root.rglob("*") if root.exists() else ():
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  matches = [needle for needle in needles if needle in text]
                  if matches:
                      failures.append(f"{path}: {', '.join(matches)}")
          print("\n".join(failures))
          raise SystemExit(1 if failures else 0)

      - name: Type-check and build frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/frontend-typecheck.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/frontend-build.log"

      - name: Confirm production bundle excludes DEV runtime hook
        shell: python
        run: |
          import os
          from pathlib import Path
          dist = Path("dist")
          if not dist.is_dir():
              raise SystemExit("Production dist directory is missing")
          needle = "__POSMAN_DEV_RUNTIME_INVOKER__"
          matches = []
          for path in dist.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if needle in text:
                  matches.append(str(path))
          evidence = Path(os.environ["EVIDENCE_DIR"], "production-hook-scan.txt")
          evidence.write_text(
              "DEV runtime hook absent from production bundle.\n"
              if not matches else "\n".join(matches) + "\n",
              encoding="utf-8",
          )
          print(evidence.read_text(encoding="utf-8"), end="")
          raise SystemExit(1 if matches else 0)

      - name: Run frontend tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ui 2>&1 | tee "$EVIDENCE_DIR/ui-tests.log"
          npm run test:integration 2>&1 | tee "$EVIDENCE_DIR/frontend-integration-tests.log"

      - name: Run Playwright browser, accessibility, and screenshot evidence
        env:
          POSMAN_ARTIFACT_DIR: ${{ runner.temp }}/posman-ui-artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee "$EVIDENCE_DIR/e2e-output.log"

      - name: Validate Rust and native desktop application
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | tee "$EVIDENCE_DIR/rust-fmt.log"
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/rust-clippy.log"
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/rust-tests.log"
          npm run desktop:check 2>&1 | tee "$EVIDENCE_DIR/desktop-check.log"

      - name: Check Phase 04 patch and worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASELINE_SHA...HEAD" 2>&1 | tee "$EVIDENCE_DIR/git-diff-check.log"
          git diff --check 2>&1 | tee -a "$EVIDENCE_DIR/git-diff-check.log"
          status="$(git status --short --untracked-files=all)"
          printf '%s\n' "$status" | tee "$EVIDENCE_DIR/worktree-status.txt"
          [[ -z "$status" ]]

      - name: Upload Phase 04 integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-04-integration-evidence
          path: |
            ${{ runner.temp }}/phase-04-integration-evidence
            ${{ runner.temp }}/posman-ui-artifacts
          if-no-files-found: error
          retention-days: 30

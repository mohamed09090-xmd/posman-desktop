name: PHASE 09 documents reports audit backup

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase09-ci.yml'
      - 'database/**'
      - 'docs/execution/POSMAN-PHASE-09-EXECUTION-PACK.md'
      - 'docs/architecture/phase-09-documents-reports-audit-backup.md'
      - 'docs/PHASE-09-REPORT.md'
      - 'scripts/verify_phase09.py'
      - 'scripts/phase09_policy.py'
      - 'src-tauri/**'
      - 'src/platform/tauri/phase09/**'
      - 'src/features/phase09/**'
      - 'src/app/AppRoot.tsx'
      - 'src/i18n/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase09-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Public source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PHASE 09 head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject tracked private/runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|.*\.(sqlite|sqlite3|db|db3|wal|shm|journal|pdf|pfx|p12|key|pem)$|backups?/|documents?/.*\.(pdf|csv)$)'
          if git ls-files | grep -E -i "$forbidden"; then
            echo 'Forbidden runtime/private artifact is tracked.' >&2
            exit 1
          fi

      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=posman-desktop/ HEAD > posman-phase09-source.tar.gz
          test -s posman-phase09-source.tar.gz
          sha256sum posman-phase09-source.tar.gz > posman-phase09-source.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase-09-source-snapshot
          path: |
            posman-phase09-source.tar.gz
            posman-phase09-source.sha256
          if-no-files-found: error
          retention-days: 30

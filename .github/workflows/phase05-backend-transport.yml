name: PHASE 05 backend reconciliation transport

on:
  pull_request:
    branches: [main]
    paths:
      - '.phase05-transport/**'
      - '.github/workflows/phase05-backend-transport.yml'

permissions:
  contents: write

concurrency:
  group: phase05-backend-transport
  cancel-in-progress: false

jobs:
  apply-and-compile:
    if: github.event.pull_request.head.ref == 'phase/05-setup-security-reference-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-setup-security-reference-data
          fetch-depth: 0

      - name: Verify coordinate and payloads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ed7f440e006babf47aea82623b178f6a3fae680c"
          test "$(git log -1 --pretty=%s)" = "chore(phase05): resolve reference DTO compiler warning"
          test "$(git rev-parse origin/main)" = "77d297f08ec3c46920dd1b94710995834854dd9a"
          test ! -e nonexistent
          printf '%s  %s\n' '44815beb77e15690e4762be70eebe316a5b6f2393799b1014c52919f1db584b2' '.phase05-transport/05b-backend-core.b64' | sha256sum --check --strict
          printf '%s  %s\n' 'f90ebc69c3cef5939881b72e18fc006cee01afa886b73b29dc84ce4eafcb263a' '.phase05-transport/05b-cargo-fix2.b64' | sha256sum --check --strict
          printf '%s  %s\n' 'd554b9b83901d8d416cbd36f558736b26cbdc79644b4b797f5a90d11346f69a4' '.phase05-transport/05b-compile-fix.b64' | sha256sum --check --strict
          printf '%s  %s\n' '8438cf7d88795debb66108527e2b0185beaa7fba1db1f0650ee7b6729dc5731f' '.phase05-transport/05b-deadcode-fix.b64' | sha256sum --check --strict
          base64 --decode .phase05-transport/05b-backend-core.b64 > /tmp/phase05-backend.tar.gz
          base64 --decode .phase05-transport/05b-cargo-fix2.b64 > /tmp/phase05-cargo-fix2.tar.gz
          base64 --decode .phase05-transport/05b-compile-fix.b64 > /tmp/phase05-compile-fix.tar.gz
          base64 --decode .phase05-transport/05b-deadcode-fix.b64 > /tmp/phase05-deadcode-fix.tar.gz
          printf '%s  %s\n' 'f3e10c893f80406ed6a9a4feb2377a011cce843ded33df49f00e193734fff83b' '/tmp/phase05-backend.tar.gz' | sha256sum --check --strict
          printf '%s  %s\n' 'd90060c3e12c7514c893b293112167699ef470dae657747a67a1f7fad8145fb4' '/tmp/phase05-cargo-fix2.tar.gz' | sha256sum --check --strict
          printf '%s  %s\n' '11c6c2ec586562d0b43389c373910a8ce47004391aa5d328f606a09a6478639b' '/tmp/phase05-compile-fix.tar.gz' | sha256sum --check --strict
          printf '%s  %s\n' 'a7fe6e8dc3fa7de9ae4c464f88e57852344c7b407fd661d63388f9b1e5f070b6' '/tmp/phase05-deadcode-fix.tar.gz' | sha256sum --check --strict

      - name: Apply backend reconciliation
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip --file /tmp/phase05-backend.tar.gz --directory .
          tar --extract --gzip --file /tmp/phase05-cargo-fix2.tar.gz --directory .
          tar --extract --gzip --file /tmp/phase05-compile-fix.tar.gz --directory .
          tar --extract --gzip --file /tmp/phase05-deadcode-fix.tar.gz --directory .

      - name: Install official Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy

      - name: Generate lockfile and validate Rust 1.85
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_schema.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          git diff --check

      - name: Commit logical backend reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/src
          git rm -r .phase05-transport .github/workflows/phase05-backend-transport.yml
          test ! -e nonexistent
          git diff --cached --check
          git config user.name 'POSMAN implementation engineer'
          git config core.user.email '144628717+mohamed09090-xmd@users.noreply.github.com'
          git commit -m 'feat(phase05): wire typed backend services and IPC commands'
          git push origin HEAD:phase/05-setup-security-reference-data

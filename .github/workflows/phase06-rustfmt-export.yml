name: PHASE 06 rustfmt export

on:
  push:
    branches:
      - "phase/06-inventory-purchasing"
    paths:
      - ".github/workflows/phase06-rustfmt-export.yml"
      - "src-tauri/src/**"

permissions:
  contents: read

jobs:
  rustfmt-export:
    name: Format Rust sources for PHASE 06 repair
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust 1.85 rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt

      - name: Format and record changed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rustfmt-export
          git rev-parse "HEAD^{tree}" > rustfmt-export/base-tree.txt
          git rev-parse HEAD > rustfmt-export/head.txt
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --name-only -- src-tauri > rustfmt-export/changed-files.txt
          git diff --check

      - name: Upload formatted Rust sources
        uses: actions/upload-artifact@v4
        with:
          name: phase06-rustfmt-export
          path: |
            rustfmt-export
            src-tauri/src/**/*.rs
          if-no-files-found: error
          retention-days: 1

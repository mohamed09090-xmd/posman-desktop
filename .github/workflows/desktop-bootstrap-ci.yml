name: Desktop bootstrap CI

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-bootstrap-ci.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
      - "docs/BOOTSTRAP-GATE-02-REPORT.md"
      - "docs/architecture/desktop-shell.md"
      - "docs/architecture/parallel-wave-02-contract.md"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
  push:
    branches:
      - "main"
      - "bootstrap/desktop-shell"
    paths:
      - ".github/workflows/desktop-bootstrap-ci.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
      - "docs/BOOTSTRAP-GATE-02-REPORT.md"
      - "docs/architecture/desktop-shell.md"
      - "docs/architecture/parallel-wave-02-contract.md"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"

concurrency:
  group: desktop-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-desktop-shell:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify accepted SQLite foundation
        run: python scripts/verify_schema.py

      - name: Confirm PHASE 01 database sources are unchanged
        run: git diff --exit-code 0c72eb75eb5db916a51d1ee42fec47f21328ad28 -- database scripts/verify_schema.py

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install official Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Record platform tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Record Tauri CLI version
        run: npx --no-install tauri --version

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Reject runtime network clients in bootstrap sources
        run: python -c "from pathlib import Path; roots=[Path('src'),Path('src-tauri/src')]; needles=('fetch(','XMLHttpRequest','reqwest::','ureq::','http://','https://'); bad=[str(p) for r in roots for p in r.rglob('*') if p.is_file() and any(n in p.read_text(encoding='utf-8') for n in needles)]; print('\n'.join(bad)); raise SystemExit(1 if bad else 0)"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust clippy with warnings denied
        id: clippy
        run: python -c "import os,subprocess,sys; from pathlib import Path; output=Path(os.environ['RUNNER_TEMP'])/'clippy-output.txt'; command=['cargo','clippy','--manifest-path','src-tauri/Cargo.toml','--all-targets','--all-features','--locked','--','-D','warnings']; result=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT); output.write_text(result.stdout,encoding='utf-8'); print(result.stdout,end=''); sys.exit(result.returncode)"

      - name: Upload clippy diagnostics
        if: always() && steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/clippy-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Diagnose Windows Rust test loader inputs
        id: windows-loader-diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoJson = Join-Path $env:RUNNER_TEMP 'cargo-test-build.jsonl'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'windows-loader-diagnostics.txt'
          $manifest = Join-Path $env:RUNNER_TEMP 'rust-test.manifest.xml'

          'Windows Rust test loader diagnosis started.' | Set-Content -Path $diagnostics -Encoding utf8

          try {
            cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked --no-run --message-format=json-render-diagnostics |
              Tee-Object -FilePath $cargoJson
            if ($LASTEXITCODE -ne 0) {
              throw "cargo test --no-run failed with exit code $LASTEXITCODE."
            }

            $testExecutables = Get-Content $cargoJson | ForEach-Object {
              try {
                $_ | ConvertFrom-Json
              } catch {
                $null
              }
            } | Where-Object {
              $_.reason -eq 'compiler-artifact' -and
              $_.profile.test -eq $true -and
              $_.target.name -eq 'posman_desktop_lib' -and
              $_.executable
            } | Select-Object -ExpandProperty executable -Unique

            if (-not $testExecutables) {
              'Cargo JSON did not expose the executable; using deterministic target/deps fallback.' |
                Add-Content -Path $diagnostics
              $testExecutables = Get-ChildItem 'src-tauri\target\debug\deps\posman_desktop_lib-*.exe' -File |
                Sort-Object LastWriteTimeUtc -Descending |
                Select-Object -ExpandProperty FullName
            }

            if (-not $testExecutables) {
              throw 'The posman_desktop_lib test executable was not found.'
            }

            $testExecutable = $testExecutables |
              Sort-Object { (Get-Item $_).LastWriteTimeUtc } -Descending |
              Select-Object -First 1

            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $visualStudio) {
              throw 'Visual Studio C++ tools were not found.'
            }

            $dumpbin = Get-ChildItem (Join-Path $visualStudio 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') -File |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            $mt = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\*\x64\mt.exe') -File |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $dumpbin) {
              throw 'dumpbin.exe was not found.'
            }
            if (-not $mt) {
              throw 'mt.exe was not found.'
            }

            @(
              "Test executable: $testExecutable"
              "dumpbin: $dumpbin"
              "mt.exe: $mt"
              ''
              '=== PE IMPORTS ==='
            ) | Add-Content -Path $diagnostics

            & $dumpbin /headers /imports $testExecutable 2>&1 |
              Tee-Object -FilePath $diagnostics -Append
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed with exit code $LASTEXITCODE."
            }

            '' | Add-Content -Path $diagnostics
            '=== EMBEDDED MANIFEST ===' | Add-Content -Path $diagnostics
            & $mt "-inputresource:$testExecutable;#1" "-out:$manifest" 2>&1 |
              Tee-Object -FilePath $diagnostics -Append
            $manifestExit = $LASTEXITCODE

            if ($manifestExit -eq 0 -and (Test-Path $manifest)) {
              Get-Content $manifest | Add-Content -Path $diagnostics
            } else {
              "Manifest extraction failed with exit code $manifestExit." | Add-Content -Path $diagnostics
            }
          } catch {
            "DIAGNOSTIC ERROR: $($_.Exception.Message)" | Add-Content -Path $diagnostics
            Get-Content $diagnostics
            throw
          }

          Get-Content $diagnostics

      - name: Run Rust tests
        id: rust-tests
        run: python -c "import os,subprocess,sys; from pathlib import Path; output=Path(os.environ['RUNNER_TEMP'])/'rust-test-output.txt'; command=['cargo','test','--manifest-path','src-tauri/Cargo.toml','--all-targets','--locked','--','--nocapture']; result=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT); output.write_text(result.stdout,encoding='utf-8'); print(result.stdout,end=''); sys.exit(result.returncode)"

      - name: Upload Rust test diagnostics
        if: always() && steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/rust-test-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows loader diagnostics
        if: always() && runner.os == 'Windows' && (steps.windows-loader-diagnostics.outcome == 'failure' || steps.rust-tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: windows-rust-loader-diagnostics
          path: |
            ${{ runner.temp }}/windows-loader-diagnostics.txt
            ${{ runner.temp }}/cargo-test-build.jsonl
            ${{ runner.temp }}/rust-test.manifest.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Compile native Tauri shell without bundling
        run: npm run desktop:check

      - name: Check Git whitespace
        run: git diff --check

      - name: Confirm clean worktree
        id: clean-worktree
        run: python -c "import os,subprocess,sys; from pathlib import Path; status=subprocess.check_output(['git','status','--short','--untracked-files=all'],text=True); diff=subprocess.check_output(['git','diff','--no-ext-diff'],text=True); details='STATUS\n'+status+'\nDIFF\n'+diff; output=Path(os.environ['RUNNER_TEMP'])/'worktree-diagnostics.txt'; output.write_text(details,encoding='utf-8'); print(details,end=''); sys.exit(1 if status else 0)"

      - name: Upload worktree diagnostics
        if: always() && steps.clean-worktree.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: worktree-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/worktree-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
